<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap web development</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3 fixed-top">
      <div class="container">
        <a href="#" class="navbar-brand"
          ><img
            src="./tom.jpeg"
            width="70px"
            class="rounded"
            alt=""
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navmenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="#Learn" class="nav-link">What You will Learn</a>
            </li>
            <li class="nav-item">
              <a href="#questions" class="nav-link">Questions </a>
            </li>
            <li class="nav-item">
              <a href="#instructions" class="nav-link">Instructions</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ShowCase -->
    <section
      class="bg-dark text-light p-5-lg-0 pt-lg-5 text-center text-sm-start"
    >
      <div class="container">
        <div class="d-md-flex align-items-center justify-content-between">
          <div>
            <h1>Become a <span class="text-warning">Web Developer</span></h1>
            <p class="lead my-4">
              We Focus on teaching Our Students The Fundamentals Of The Latest
              And Greatest Technologies To Prepare them for their first
              development roles
            </p>
            <button class="btn btn-primary btn-lg" data-bs-toggle="modal">
              Start The Enrollment
            </button>
          </div>
          <img src=".//img/showcase.svg" alt="showcase image" class="img-fluid w-50 d-none d-sm-block">
        </div>
      </div>
    </section>
    <!-- NewsLetter -->
     <section class="bg-primary text-light p5">
       <div class="container">
        <div class="d-md-flex justify-content-between align-items-center">
<h3 class="mb-3 mb-md-0">Sign up For Our Newsletter</h3>
<form action="#">
  <div class="input-group news-input">
    <input type="text" name="email" id="email" class="form control"/>
<button class="btn btn-dark btn-lg"
type="button">Submit</button>
  </div>
</form>
        </div>
       </div>
     </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
